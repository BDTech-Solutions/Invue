name: monorepo-split

on:
  push:
    tags: '*'

permissions:
  contents: read

jobs:
  split-monorepo:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - actions
          - core
          - forms
          - infolists
          - notifications
          - panels
          - tables
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: previous-tag
        uses: WyriHaximus/github-action-get-previous-tag@v2
      - name: Monorepo Split of ${{ matrix.package }}
        uses: danharrin/monorepo-split-github-action@v2.4.5
        env:
          GITHUB_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
        with:
          package_directory: 'packages/${{ matrix.package }}'
          repository_organization: 'BDTech-Solutions'
          repository_name: 'invue-${{ matrix.package }}'
          branch: main
          tag: ${{ steps.previous-tag.outputs.tag }}
          user_name: 'Daniel Alvarez'
          user_email: 'daniel.alvarez.almeida.18@gmail.com'
